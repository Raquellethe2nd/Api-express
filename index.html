<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Space Station</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <nav>
        <a href="/">Home</a>
        <a href="/projects">Projects</a>
        <a href="/guestbook">Guestbook</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/space">Space</a>
    </nav>

    <main class="home-container">
        <h1>Welcome</h1>
        <p class="intro">Log in to explore!</p>

        <section id="status" aria-live="polite"></section>

        <section id="login-section" class="login-card" hidden>
            <h2>Welcome Back!</h2>
            <p class="card-intro">Log in to continue your journey.</p>

            <form id="login-form" action="/login" method="post">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" autocomplete="username"
                        placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password"
                        placeholder="Enter your password" required>
                </div>

                <label class="remember-label">
                    <input type="checkbox" name="rememberMe">
                    Remember me
                </label>

                <button class="login-button" type="submit">Log in ✦</button>

                <p id="login-message" role="status" aria-live="polite"></p>
            </form>

            <p class="register-link">
                New here? <a href="/register">Create an account</a>
            </p>
        </section>

        <button id="logout-button" class="logout-button" type="button" hidden>
            Log out
        </button>
    </main>

    <script src="/login.js"></script>
    <script src="/logout.js"></script>

</body>

</html>
